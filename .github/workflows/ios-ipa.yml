name: Build iPhone IPA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
      - name: Test native schedule and ledger
        run: |
          mkdir -p build
          set -o pipefail
          swift test 2>&1 | tee build/domain-tests.log
      - name: Build real iPhone ARM64 IPA
        run: bash Scripts/build-ipa.sh
      - name: Diagnose logs
        if: always()
        run: |
          python3 Scripts/diagnose.py build
          cat build/diagnosis.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoyuCalendar-ARM64-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/output/*.ipa
            build/output/SHA256SUMS.txt
            build/output/ipa-validation.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoyuCalendar-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/*.log
            build/diagnosis.*
          if-no-files-found: warn
          retention-days: 30
